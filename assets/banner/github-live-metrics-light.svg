<text x="38" y="118" fill="#172A20" font-family="Arial,sans-serif" font-size="41" font-weight="700">372</text>
<text x="38" y="144" fill="#4A6857" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">COMMITS · 2026</text>
<text x="220" y="118" fill="#172A20" font-family="Arial,sans-serif" font-size="41" font-weight="700">9</text>
<text x="220" y="144" fill="#4A6857" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">PUBLIC REPOS</text>
