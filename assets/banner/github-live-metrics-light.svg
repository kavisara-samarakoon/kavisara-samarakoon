<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc">
<title id="title">Public GitHub activity and languages</title>
<desc id="desc">Calendar-year authored commits on public repository default branches, public repository count, stars, and leading languages by code bytes. Refreshed daily.</desc>
<defs>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBFDFB"/><stop offset="100%" stop-color="#F0F8F3"/></linearGradient>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#457C0B" stop-opacity=".08"/><stop offset="48%" stop-color="#457C0B" stop-opacity=".8"/><stop offset="70%" stop-color="#178979" stop-opacity=".75"/><stop offset="100%" stop-color="#178979" stop-opacity=".08"/></linearGradient>
<clipPath id="languageBar"><rect x="582" y="73" width="468" height="12" rx="6"/></clipPath>
<clipPath id="cardOne"><rect x="12" y="12" width="524" height="168" rx="19"/></clipPath>
<clipPath id="cardTwo"><rect x="551" y="12" width="537" height="168" rx="19"/></clipPath>
<style>
@keyframes flow { from { stroke-dashoffset: 530; } to { stroke-dashoffset: 0; } }
@keyframes shimmer { from { transform: translateX(0px); } to { transform: translateX(590px); } }
@keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .95; } }
@media (prefers-reduced-motion: no-preference) {
.signal { animation: flow 11s linear infinite; }
.signal.delay { animation-duration: 14s; animation-delay: -5s; }
.shimmer { animation: shimmer 7s ease-in-out infinite; }
.node { animation: breathe 4.5s ease-in-out infinite; }
}
</style>
</defs>
<rect x="12" y="12" width="524" height="168" rx="19" fill="url(#panel)" stroke="#BEDCC8" stroke-width="1.4"/>
<rect x="551" y="12" width="537" height="168" rx="19" fill="url(#panel)" stroke="#BEDCC8" stroke-width="1.4"/>
<path d="M37 35H511 M579 35H1059" stroke="url(#accent)" stroke-width="1.8" fill="none"/>
<path class="signal" d="M37 35H511" stroke="#457C0B" stroke-opacity=".45" stroke-width="2.2" fill="none" stroke-dasharray="18 512" stroke-linecap="round"/>
<path class="signal delay" d="M579 35H1059" stroke="#178979" stroke-opacity=".43" stroke-width="2.2" fill="none" stroke-dasharray="18 512" stroke-linecap="round"/>
<circle class="node" cx="505" cy="35" r="3" fill="#457C0B"/>
<circle class="node" cx="1054" cy="35" r="3" fill="#178979"/>
