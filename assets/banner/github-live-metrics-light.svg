<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 152" role="img" aria-labelledby="title desc">
<title id="title">Public GitHub activity and programming languages</title>
<desc id="desc">Verified public data: authored commits on public repository default branches during the current calendar year, public repository count, stars, and languages by code bytes. The 1000+ featured commits figure is a manually selected display, not an API measurement.</desc>
<defs>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F8FCF9"/><stop offset="100%" stop-color="#EDF7EF"/></linearGradient>
<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#548A10" stop-opacity=".12"/><stop offset="45%" stop-color="#548A10" stop-opacity=".75"/><stop offset="68%" stop-color="#168779" stop-opacity=".65"/><stop offset="100%" stop-color="#168779" stop-opacity=".12"/></linearGradient>
<clipPath id="barClip"><rect x="581" y="64" width="473" height="10" rx="5"/></clipPath>
<style>
@keyframes borderFlow {from {stroke-dashoffset: 1320;} to {stroke-dashoffset: 0;}}
@keyframes scan {from {transform:translateX(-70px);} to {transform:translateX(560px);}}
@keyframes softPulse {0%,100% {opacity:.4;} 50% {opacity:.85;}}
@media (prefers-reduced-motion: no-preference) {
.framePulse {animation:borderFlow 16s linear infinite;}
.framePulse.reverse {animation-duration:19s;animation-direction:reverse;}
.scan {animation:scan 8s linear infinite;}
.signalDot {animation:softPulse 5s ease-in-out infinite;}
}
</style>
</defs>
<rect x="12" y="10" width="524" height="132" rx="17" fill="url(#panel)" stroke="#B6D4BE" stroke-width="1.4"/>
<rect x="552" y="10" width="536" height="132" rx="17" fill="url(#panel)" stroke="#B6D4BE" stroke-width="1.4"/>
<rect class="framePulse" x="13" y="11" width="522" height="130" rx="16" fill="none" stroke="#548A10" stroke-opacity=".65" stroke-width="2" stroke-dasharray="54 1320"/>
<rect class="framePulse reverse" x="553" y="11" width="534" height="130" rx="16" fill="none" stroke="#168779" stroke-opacity=".6" stroke-width="2" stroke-dasharray="54 1320"/>
<circle class="signalDot" cx="508" cy="28" r="2.5" fill="#548A10"/>
<circle class="signalDot" cx="1059" cy="28" r="2.5" fill="#168779"/>
<text x="37" y="39" fill="#548A10" font-family="Arial,sans-serif" font-size="12.8" font-weight="700" letter-spacing="1.3">PUBLIC ACTIVITY</text>
<text x="580" y="39" fill="#548A10" font-family="Arial,sans-serif" font-size="12.8" font-weight="700" letter-spacing="1.3">LANGUAGES BY CODE BYTES</text>
<text x="37" y="90" fill="#14281C" font-family="Arial,sans-serif" font-size="38" font-weight="700">1000+</text>
<text x="37" y="111" fill="#516B58" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">COMMITS · 2026</text>
<text x="223" y="90" fill="#14281C" font-family="Arial,sans-serif" font-size="38" font-weight="700">9</text>
<text x="223" y="111" fill="#516B58" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">PUBLIC REPOS</text>
<text x="399" y="90" fill="#14281C" font-family="Arial,sans-serif" font-size="38" font-weight="700">32</text>
<text x="399" y="111" fill="#516B58" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">REPO STARS</text>
<rect x="581" y="64" width="473" height="10" rx="5" fill="#D9E8DD"/>
<rect clip-path="url(#barClip)" x="581.00" y="64" width="178.57" height="10" fill="#6BA52B"/>
<rect clip-path="url(#barClip)" x="759.57" y="64" width="126.82" height="10" fill="#199989"/>
<rect clip-path="url(#barClip)" x="886.39" y="64" width="70.42" height="10" fill="#5A82CD"/>
<rect class="scan" clip-path="url(#barClip)" x="560" y="64" width="42" height="10" fill="#FFFFFF" opacity=".10"/>
<circle cx="586" cy="97" r="4" fill="#6BA52B"/>
<text x="599" y="102" fill="#14281C" font-family="Arial,sans-serif" font-size="16">Python 37.8%</text>
<circle cx="821" cy="97" r="4" fill="#199989"/>
<text x="834" y="102" fill="#14281C" font-family="Arial,sans-serif" font-size="16">Rust 26.8%</text>
<circle cx="586" cy="125" r="4" fill="#5A82CD"/>
<text x="599" y="130" fill="#14281C" font-family="Arial,sans-serif" font-size="16">TypeScript 14.9%</text>
</svg>
