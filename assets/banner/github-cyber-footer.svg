
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 210"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Kavisara Samarakoon — Animated GitHub Footer</title>
  <desc id="desc">
    Minimal cybersecurity footer featuring animated network
    signals, glowing nodes, and flowing neon-green waves.
  </desc>

  <defs>

    <!-- Main neon gradient -->
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9FF2E" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C9FF2E" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#C9FF2E" stop-opacity=".75"/>
      <stop offset="80%" stop-color="#C9FF2E" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#C9FF2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft cyan accent -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65FFDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#65FFDA" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#65FFDA" stop-opacity="0"/>
    </linearGradient>

    <!-- Transparent wave gradients -->
    <linearGradient id="greenWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9FF2E" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#C9FF2E" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65FFDA" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#65FFDA" stop-opacity="0"/>
    </linearGradient>

    <!-- Lightweight glow -->
    <filter id="softGlow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

  </defs>

  <!-- Fully transparent background -->

  <!-- Upper flowing wave -->
  <path
    d="M0 35 C240 9 430 59 700 34 S1140 8 1400 36"
    fill="none"
    stroke="url(#neonLine)"
    stroke-width="1.8">

    <animate
      attributeName="d"
      dur="11s"
      repeatCount="indefinite"
      values="
        M0 35 C240 9 430 59 700 34 S1140 8 1400 36;
        M0 39 C240 58 430 15 700 37 S1140 57 1400 32;
        M0 35 C240 9 430 59 700 34 S1140 8 1400 36"/>
  </path>

  <!-- Second wave, slower -->
  <path
    d="M0 48 C260 31 420 69 700 48 S1110 29 1400 51"
    fill="none"
    stroke="url(#cyanLine)"
    stroke-width="1.1">

    <animate
      attributeName="d"
      dur="15s"
      repeatCount="indefinite"
      values="
        M0 48 C260 31 420 69 700 48 S1110 29 1400 51;
        M0 51 C260 70 420 30 700 52 S1110 65 1400 47;
        M0 48 C260 31 420 69 700 48 S1110 29 1400 51"/>
  </path>

  <!-- Left circuit traces -->
  <g fill="none"
     stroke="#9DC98B"
     stroke-width="1.3"
     stroke-opacity=".27">

    <path d="M0 97 H125 L151 77 H360"/>
    <path d="M0 123 H95 L130 144 H355"/>
    <path d="M0 152 H140 L175 169 H310"/>

  </g>

  <!-- Right circuit traces -->
  <g fill="none"
     stroke="#9DC98B"
     stroke-width="1.3"
     stroke-opacity=".27">

    <path d="M1400 97 H1275 L1249 77 H1040"/>
    <path d="M1400 123 H1305 L1270 144 H1045"/>
    <path d="M1400 152 H1260 L1225 169 H1090"/>

  </g>

  <!-- Animated data signal: left upper -->
  <path
    d="M0 97 H125 L151 77 H360"
    fill="none"
    stroke="#C9FF2E"
    stroke-width="2.3"
    stroke-dasharray="18 410"
    stroke-opacity=".85">

    <animate
      attributeName="stroke-dashoffset"
      from="428"
      to="0"
      dur="6s"
      repeatCount="indefinite"/>
  </path>

  <!-- Animated data signal: right upper -->
  <path
    d="M1400 97 H1275 L1249 77 H1040"
    fill="none"
    stroke="#C9FF2E"
    stroke-width="2.3"
    stroke-dasharray="18 410"
    stroke-opacity=".85">

    <animate
      attributeName="stroke-dashoffset"
      from="428"
      to="0"
      dur="7.3s"
      repeatCount="indefinite"/>
  </path>

  <!-- Animated cyan signal: lower left -->
  <path
    d="M0 123 H95 L130 144 H355"
    fill="none"
    stroke="#65FFDA"
    stroke-width="1.8"
    stroke-dasharray="12 390"
    stroke-opacity=".65">

    <animate
      attributeName="stroke-dashoffset"
      from="402"
      to="0"
      dur="8.5s"
      repeatCount="indefinite"/>
  </path>

  <!-- Animated cyan signal: lower right -->
  <path
    d="M1400 123 H1305 L1270 144 H1045"
    fill="none"
    stroke="#65FFDA"
    stroke-width="1.8"
    stroke-dasharray="12 390"
    stroke-opacity=".65">

    <animate
      attributeName="stroke-dashoffset"
      from="402"
      to="0"
      dur="9.2s"
      repeatCount="indefinite"/>
  </path>

  <!-- Pulsing circuit nodes -->
  <g fill="#C9FF2E">

    <circle cx="151" cy="77" r="3.5">
      <animate attributeName="opacity"
               values=".25;1;.25"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="360" cy="77" r="3">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1249" cy="77" r="3.5">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="3.6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1040" cy="77" r="3">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="175" cy="169" r="2.5">
      <animate attributeName="opacity"
               values=".2;.7;.2"
               dur="3.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1225" cy="169" r="2.5">
      <animate attributeName="opacity"
               values=".2;.7;.2"
               dur="4.6s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Small floating signal dots -->
  <g>
    <circle cx="410" cy="97" r="2.2" fill="#C9FF2E">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;12 -9;0 -18"
        dur="7s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;.45;0"
        dur="7s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="990" cy="112" r="2" fill="#65FFDA">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-9 -8;0 -16"
        dur="8s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;.5;0"
        dur="8s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central minimal identity accent -->
  <circle cx="700" cy="78" r="3.5" fill="#C9FF2E">
    <animate
      attributeName="opacity"
      values=".35;1;.35"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <path
    d="M630 78 H684 M716 78 H770"
    fill="none"
    stroke="url(#neonLine)"
    stroke-width="1.4"/>

  <!-- Professional footer message -->
  <text
    x="700"
    y="122"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="500"
    fill="#8B949E">

    Built with curiosity.
    <tspan fill="#C9FF2E"> Secured by design.</tspan>
  </text>

  <!-- Lower flowing wave -->
  <path
    d="M0 177 C230 155 430 198 700 174 S1150 153 1400 178"
    fill="none"
    stroke="url(#neonLine)"
    stroke-width="1.3"
    opacity=".7">

    <animate
      attributeName="d"
      values="
        M0 177 C230 155 430 198 700 174 S1150 153 1400 178;
        M0 180 C230 198 430 154 700 179 S1150 196 1400 174;
        M0 177 C230 155 430 198 700 174 S1150 153 1400 178"
      dur="13s"
      repeatCount="indefinite"/>
  </path>

  <!-- Transparent lower color wash -->
  <path
    d="M0 177 C230 155 430 198 700 174 S1150 153 1400 178 V210 H0Z"
    fill="url(#greenWave)">

    <animate
      attributeName="d"
      values="
        M0 177 C230 155 430 198 700 174 S1150 153 1400 178 V210 H0Z;
        M0 180 C230 198 430 154 700 179 S1150 196 1400 174 V210 H0Z;
        M0 177 C230 155 430 198 700 174 S1150 153 1400 178 V210 H0Z"
      dur="13s"
      repeatCount="indefinite"/>
  </path>

</svg>
