<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 152" role="img" aria-labelledby="title desc">
<title id="title">Public GitHub activity and programming languages</title>
<desc id="desc">Verified public data: authored commits on public repository default branches during the current calendar year, public repository count, stars, and languages by code bytes. The 1000+ contributions milestone is a goal, not an achieved count.</desc>
<defs>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#071610"/><stop offset="100%" stop-color="#0C2018"/></linearGradient>
<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C9FF2E" stop-opacity=".12"/><stop offset="45%" stop-color="#C9FF2E" stop-opacity=".75"/><stop offset="68%" stop-color="#5AE5D4" stop-opacity=".65"/><stop offset="100%" stop-color="#5AE5D4" stop-opacity=".12"/></linearGradient>
<clipPath id="barClip"><rect x="581" y="64" width="473" height="10" rx="5"/></clipPath>
<style>
@keyframes borderFlow {from {stroke-dashoffset: 1320;} to {stroke-dashoffset: 0;}}
@keyframes scan {from {transform:translateX(-70px);} to {transform:translateX(560px);}}
@keyframes softPulse {0%,100% {opacity:.4;} 50% {opacity:.85;}}
@media (prefers-reduced-motion: no-preference) {
.framePulse {animation:borderFlow 16s linear infinite;}
.framePulse.reverse {animation-duration:19s;animation-direction:reverse;}
.scan {animation:scan 8s linear infinite;}
.signalDot {animation:softPulse 5s ease-in-out infinite;}
}
</style>
</defs>
<rect x="12" y="10" width="524" height="132" rx="17" fill="url(#panel)" stroke="#365E48" stroke-width="1.4"/>
<rect x="552" y="10" width="536" height="132" rx="17" fill="url(#panel)" stroke="#365E48" stroke-width="1.4"/>
<rect class="framePulse" x="13" y="11" width="522" height="130" rx="16" fill="none" stroke="#C9FF2E" stroke-opacity=".65" stroke-width="2" stroke-dasharray="54 1320"/>
<rect class="framePulse reverse" x="553" y="11" width="534" height="130" rx="16" fill="none" stroke="#5AE5D4" stroke-opacity=".6" stroke-width="2" stroke-dasharray="54 1320"/>
<circle class="signalDot" cx="508" cy="28" r="2.5" fill="#C9FF2E"/>
<circle class="signalDot" cx="1059" cy="28" r="2.5" fill="#5AE5D4"/>
<text x="37" y="39" fill="#C9FF2E" font-family="Arial,sans-serif" font-size="12.8" font-weight="700" letter-spacing="1.3">PUBLIC ACTIVITY</text>
<text x="580" y="39" fill="#C9FF2E" font-family="Arial,sans-serif" font-size="12.8" font-weight="700" letter-spacing="1.3">LANGUAGES BY CODE BYTES</text>
<rect x="355" y="25" width="142" height="20" rx="10" fill="none" stroke="#365E48" stroke-opacity=".9"/>
<text x="366" y="39" fill="#A8BFB0" font-family="Arial,sans-serif" font-size="10.7">GOAL: 1K+ CONTRIBUTIONS</text>
<text x="37" y="90" fill="#F2FBF5" font-family="Arial,sans-serif" font-size="38" font-weight="700">375</text>
<text x="37" y="111" fill="#A8BFB0" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">COMMITS · 2026</text>
<text x="223" y="90" fill="#F2FBF5" font-family="Arial,sans-serif" font-size="38" font-weight="700">9</text>
<text x="223" y="111" fill="#A8BFB0" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">PUBLIC REPOS</text>
<text x="399" y="90" fill="#F2FBF5" font-family="Arial,sans-serif" font-size="38" font-weight="700">32</text>
<text x="399" y="111" fill="#A8BFB0" font-family="Arial,sans-serif" font-size="12.5" font-weight="700">REPO STARS</text>
<text x="37" y="130" fill="#A8BFB0" font-family="Arial,sans-serif" font-size="10.2">Updated 13 NOV 2026 UTC</text>
<rect x="581" y="64" width="473" height="10" rx="5" fill="#253E31"/>
<rect clip-path="url(#barClip)" x="581.00" y="64" width="178.57" height="10" fill="#B3F34D"/>
<rect clip-path="url(#barClip)" x="759.57" y="64" width="126.82" height="10" fill="#5CD4C1"/>
<rect clip-path="url(#barClip)" x="886.39" y="64" width="70.42" height="10" fill="#8FB2EE"/>
<rect class="scan" clip-path="url(#barClip)" x="560" y="64" width="42" height="10" fill="#FFFFFF" opacity=".10"/>
